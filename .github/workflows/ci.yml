name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXTERNAL_API_REQUIRED: "false"
  SUPERCELL_LIVE_DATA_ENABLED: "false"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --requirement requirements.lock.txt
      - run: python -m compileall -q *.py src evaluation harness planner skills tests
      - name: Repository hygiene gate
        shell: pwsh
        run: ./scripts/check_repo.ps1 -SkipTests -SkipRuff
      - run: python -m unittest discover -s tests -t .
      - run: python -m evaluation.run_eval --report evaluation/reports/ci-contract.json
      - run: >
          python -m evaluation.run_fault_injection
          --scenarios evaluation/fault_scenarios.jsonl
          --report evaluation/reports/ci-fault-injection.json
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: evaluation/reports/
          if-no-files-found: warn

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag clash-royale-agent:${{ github.sha }} .
      - run: docker compose -f compose.production.yml config --quiet
      - run: docker compose -f compose.loadtest.yml config --quiet
      - run: docker compose -f compose.production.yml -f compose.alert-drill.yml config --quiet
      - run: >
          docker run --detach --rm --name clash-royale-agent-ci --publish 8091:8091
          --env EXTERNAL_API_REQUIRED=false --env SUPERCELL_LIVE_DATA_ENABLED=false
          clash-royale-agent:${{ github.sha }}
      - name: Verify liveness endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8091/health; then exit 0; fi
            sleep 1
          done
          docker logs clash-royale-agent-ci
          exit 1
      - name: Run two-instance k6 smoke test
        run: |
          docker compose -f compose.loadtest.yml up --build -d redis api-1 api-2 proxy
          docker compose -f compose.loadtest.yml --profile loadtest run --rm \
            -e SUMMARY_PATH=/reports/ci-smoke.json k6 run /scripts/smoke.js
      - name: Run Prometheus to Alertmanager notification drill
        shell: pwsh
        run: ./test_alert_pipeline.ps1
      - name: Upload deployment reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-reports
          path: |
            load/reports/
            evaluation/reports/alert-drill-*.json
          if-no-files-found: warn
      - name: Stop deployment test stacks
        if: always()
        run: docker compose -f compose.loadtest.yml down --volumes || true
      - name: Stop container
        if: always()
        run: docker stop clash-royale-agent-ci || true
