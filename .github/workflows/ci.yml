name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  EXTERNAL_API_REQUIRED: "false"
  SUPERCELL_LIVE_DATA_ENABLED: "false"
  PIP_DEFAULT_TIMEOUT: "120"

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --requirement requirements.lock.txt
      - run: python -m compileall -q *.py evaluation harness planner skills tests
      - run: python -m unittest discover -s tests
      - run: python -m evaluation.run_eval --report evaluation/reports/ci-evaluation.json
      - run: >
          python -m evaluation.citation_benchmark
          --documents data/rag_documents.json
          --report evaluation/reports/ci-citation.json
      - run: >
          python -m evaluation.run_fault_injection
          --scenarios evaluation/fault_scenarios.jsonl
          --report evaluation/reports/ci-fault-injection.json
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports
          path: evaluation/reports/
          if-no-files-found: warn

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag clash-royale-agent:${{ github.sha }} .
      - run: docker compose -f compose.production.yml config --quiet
      - run: >
          docker run --detach --rm --name clash-royale-agent-ci --publish 8091:8091
          --env EXTERNAL_API_REQUIRED=false --env SUPERCELL_LIVE_DATA_ENABLED=false
          clash-royale-agent:${{ github.sha }}
      - name: Verify liveness endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8091/health; then exit 0; fi
            sleep 1
          done
          docker logs clash-royale-agent-ci
          exit 1
      - name: Stop container
        if: always()
        run: docker stop clash-royale-agent-ci || true
