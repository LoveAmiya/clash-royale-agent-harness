# Package and tooling configuration.
#
# Runtime entry points remain root-level compatibility modules during the staged
# migration, while the reusable package boundary lives under src/.

[project]
name = "clashroyale-agent-harness"
version = "0.1.0"
description = "Local Clash Royale structured QA and RAG runtime."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  ".venv",
  "data/corpus",
  "data/rolling_lanes",
  "data/snapshot_groups",
  "data/structured_stats",
  "evaluation/reports",
  "logs",
  "tmp",
]

[tool.ruff.lint]
# Start with high-signal syntax/name checks only. Broader style rules should be
# enabled after the package split, when formatting churn can be isolated.
select = ["E9", "F63", "F7", "F82"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra -m 'not live_api'"
markers = [
  "unit: pure deterministic logic with no private runtime data",
  "integration: local API or UI integration coverage",
  "windows: requires Windows PowerShell or Windows task behavior",
  "collector: collection and publication contract coverage",
  "rag: deterministic RAG and retrieval coverage",
  "live_api: opt-in credentialed external API smoke coverage",
]

[tool.mypy]
python_version = "3.11"
files = ["src/clashroyale_agent"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
omit = [
  ".venv/*",
  "data/*",
  "evaluation/reports/*",
  "logs/*",
  "tmp/*",
]

[tool.coverage.report]
skip_empty = true
show_missing = true
