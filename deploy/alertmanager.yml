global:
  resolve_timeout: 5m

route:
  receiver: operations-webhook
  group_by: [alertname, severity]
  group_wait: 2s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: operations-webhook
    webhook_configs:
      - url: http://alert-webhook:8094/alerts
        send_resolved: true

inhibit_rules:
  - source_matchers: ['severity="page"']
    target_matchers: ['severity="ticket"']
    equal: [alertname]

