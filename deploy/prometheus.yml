global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: clash-royale-agent
    metrics_path: /metrics
    static_configs:
      - targets: ["api-1:8091", "api-2:8091"]
  - job_name: clash-royale-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["collector:8092"]
  - job_name: clash-royale-alert-receiver
    metrics_path: /metrics
    static_configs:
      - targets: ["alert-webhook:8094"]
